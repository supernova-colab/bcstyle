<meta name="apple-mobile-web-app-title" content="B.C. Style">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2eee7">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3efe8; --paper:#fbf9f5; --sand:#e9e2d5; --ink:#24272a; --soft:#6b6d6e; --line:#ddd4c5;
    --dark:#1c1e1f; --green:#22302a; --green2:#2c3d35; --brass:#a8884f; --brass-l:#c9ad7a; --wine:#5d2a27;
    --ok:#3f8f4a; --off:#b4473b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.6;padding-bottom:0;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .wrap{max-width:560px;margin:0 auto;padding:0 24px}

  /* Pantalla de inicio */
  #splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .7s ease,visibility .7s;animation:autoHide .01s 5s forwards}
  #splash.hide{opacity:0;visibility:hidden}
  #splash img{width:128px;mix-blend-mode:multiply;opacity:0;animation:sIn 1s .1s ease forwards}
  #splash .sn{font-family:"Cormorant Garamond",serif;font-size:21px;font-weight:600;letter-spacing:7px;padding-left:7px;opacity:0;animation:sIn 1s .4s ease forwards}
  #splash .ss{font-size:9.5px;letter-spacing:4px;padding-left:4px;color:var(--soft);margin-top:-16px;opacity:0;animation:sIn 1s .55s ease forwards}
  #splash .sl{width:84px;height:1px;background:var(--line);position:relative;overflow:hidden;margin-top:6px}
  #splash .sl:after{content:"";position:absolute;inset:0;background:var(--brass);transform:translateX(-100%);animation:load 1.5s .3s ease-in-out forwards}
  @keyframes sIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes load{to{transform:none}}
  @keyframes autoHide{to{opacity:0;visibility:hidden}}

  header{text-align:center;padding:60px 24px 56px}
  header img{width:100%;max-width:260px;display:block;margin:0 auto;mix-blend-mode:multiply}
  .status{display:inline-flex;align-items:center;gap:9px;margin-top:20px;font-size:12px;letter-spacing:.3px;color:var(--soft);padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
  .dot{width:7px;height:7px;border-radius:50%}

  nav{position:sticky;top:0;z-index:5;background:rgba(243,239,232,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:13px 24px;max-width:560px;margin:0 auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;background:transparent;border:1px solid var(--line);color:var(--soft);padding:7px 15px;border-radius:999px;font:500 12px Inter;letter-spacing:.5px;cursor:pointer;transition:.25s}
  .tab.on{background:var(--green);color:#efe8db;border-color:var(--green)}

  /* Apartados: franjas de color de lado a lado */
  section{padding:84px 0;scroll-margin-top:60px;position:relative}
  .band{--bandc:var(--bg);background:var(--bandc);box-shadow:0 0 0 100vmax var(--bandc);clip-path:inset(0 -100vmax)}
  .b-sand{--bandc:var(--sand)}
  .b-green{--bandc:var(--green);color:#ece5d8}
  .b-dark{--bandc:var(--dark);color:#ece5d8}
  .kicker{font-size:10px;letter-spacing:3.2px;text-transform:uppercase;color:var(--brass);margin-bottom:14px}
  .b-green .kicker,.b-dark .kicker{color:var(--brass-l)}
  h2{font-family:"Cormorant Garamond",serif;font-size:38px;font-weight:500;line-height:1.08;letter-spacing:.2px}
  h2:after{content:"";display:block;width:32px;height:1px;background:var(--brass);margin:20px 0 0}
  .h2sub{color:var(--soft);font-size:14px;margin:18px 0 36px;max-width:420px}
  .b-green .h2sub,.b-dark .h2sub{color:rgba(236,229,216,.62)}

  .intro{text-align:center}
  .intro h2:after{margin:20px auto 0}
  .lead{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;font-size:22px;line-height:1.45;margin:24px auto 0;max-width:400px;color:rgba(236,229,216,.88)}
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);margin-top:48px;border-top:1px solid rgba(236,229,216,.14);border-bottom:1px solid rgba(236,229,216,.14)}
  .pillars div{padding:24px 6px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(236,229,216,.7);line-height:1.7}
  .pillars div+div{border-left:1px solid rgba(236,229,216,.14)}
  .pillars b{display:block;font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:500;letter-spacing:0;color:var(--brass-l);line-height:1;margin-bottom:10px}

  .menu{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:8px 24px;box-shadow:0 20px 40px -32px rgba(0,0,0,.4)}
  .item{display:flex;align-items:center;gap:14px;padding:22px 0;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
  .item:last-child{border-bottom:none}
  .chk{flex:none;width:20px;height:20px;border:1px solid #b9b1a3;border-radius:50%;display:grid;place-items:center;font-size:11px;color:transparent;transition:.25s}
  .item.sel .chk{background:var(--green);border-color:var(--green);color:#efe8db}
  .itxt{min-width:0}
  .iname{font-family:"Cormorant Garamond",serif;font-size:21px;font-weight:600;line-height:1.2;display:block}
  .idesc{font-size:12.5px;color:var(--soft);display:block;margin-top:3px}
  .dots{display:none;flex:1;border-bottom:1px dotted #c7bfb1;transform:translateY(-4px);min-width:14px;align-self:flex-end;margin-bottom:12px}
  .iprice{margin-left:auto;flex:none;font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:600;color:var(--wine)}

  .exp{display:grid;gap:0;border-top:1px solid rgba(236,229,216,.14)}
  .exp div{display:flex;gap:18px;padding:22px 0;border-bottom:1px solid rgba(236,229,216,.14)}
  .exp .n{font-family:"Cormorant Garamond",serif;font-size:15px;color:var(--brass-l);letter-spacing:1px;width:26px;flex:none;padding-top:4px}
  .exp h3{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:500;line-height:1.2;margin-bottom:4px}
  .exp p{font-size:13.5px;color:rgba(236,229,216,.62)}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:28px 24px;margin-bottom:22px;cursor:pointer;transition:.25s;box-shadow:0 20px 40px -32px rgba(0,0,0,.4);-webkit-tap-highlight-color:transparent}
  .card:last-child{margin-bottom:0}
  .card.sel{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
  .card.oro{background:var(--dark);color:#ece5d8;border-color:#3a3527;box-shadow:0 0 0 1px rgba(168,136,79,.45) inset,0 24px 44px -30px rgba(0,0,0,.6)}
  .card.ev{background:var(--green);color:#ece5d8;border-color:var(--green);box-shadow:0 24px 44px -30px rgba(34,48,42,.8)}
  .card.oro.sel,.card.ev.sel{box-shadow:0 0 0 2px var(--brass-l) inset}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .name{font-family:"Cormorant Garamond",serif;font-size:25px;font-weight:600;line-height:1.2}
  .price{font-family:"Cormorant Garamond",serif;font-size:27px;font-weight:600;white-space:nowrap;color:var(--wine)}
  .oro .price,.ev .price{color:var(--brass-l)}
  .pdesc{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:16.5px;opacity:.8;margin-top:6px}
  .meta{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;opacity:.6;margin-top:10px}
  .badge{display:inline-block;font:500 8.5px Inter;letter-spacing:1.8px;text-transform:uppercase;color:var(--brass-l);border:1px solid rgba(201,173,122,.6);border-radius:999px;padding:3px 9px;margin-bottom:12px}
  ul.inc{list-style:none;margin-top:20px;padding-top:18px;border-top:1px solid rgba(128,128,128,.2);display:grid;gap:10px}
  ul.inc li{font-size:13.5px;padding-left:20px;position:relative;opacity:.88}
  ul.inc li:before{content:"✦";position:absolute;left:0;font-size:9px;top:4px;color:var(--brass)}
  .oro ul.inc li:before,.ev ul.inc li:before{color:var(--brass-l)}

  .box{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:8px 24px;box-shadow:0 20px 40px -32px rgba(0,0,0,.4)}
  .step{display:flex;gap:20px;padding:24px 0;border-bottom:1px solid var(--line)}
  .step:last-child{border-bottom:none}
  .step .n{flex:none;font-family:"Cormorant Garamond",serif;font-size:32px;font-weight:500;line-height:1;color:var(--brass);width:36px}
  .step h3{font-family:"Cormorant Garamond",serif;font-size:21px;font-weight:600;line-height:1.2;margin-bottom:4px}
  .step p{font-size:13.5px;color:var(--soft)}

  .tips{list-style:none;display:grid;gap:14px}
  .tips li{background:var(--paper);border:1px solid var(--line);border-left:2px solid var(--brass);border-radius:6px 18px 18px 6px;padding:18px 20px;font-size:13.5px;color:var(--soft)}
  .tips b{display:block;font-family:"Cormorant Garamond",serif;font-size:19px;font-weight:600;color:var(--ink);margin-bottom:2px}

  .hrow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:19px 0;border-bottom:1px solid var(--line)}
  .hrow:last-child{border-bottom:none}
  .hrow span:last-child{text-align:right;color:var(--soft)}
  .hrow.today span:first-child{font-weight:600;color:var(--green)}
  .hrow.today span:last-child{font-weight:600;color:var(--ink)}
  .hrow .closed{color:var(--off)}

  .contact{display:grid;gap:0;border-top:1px solid rgba(236,229,216,.14)}
  .contact a,.contact div{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:22px 0;border-bottom:1px solid rgba(236,229,216,.14);color:#ece5d8;text-decoration:none}
  .contact small{display:block;font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:var(--brass-l);margin-bottom:4px}
  .contact span{font-size:15px}
  .contact i{font-style:normal;color:var(--brass-l);font-size:18px}
  .mapbtn{display:block;text-align:center;margin-top:32px;padding:15px;border:1px solid var(--brass-l);border-radius:999px;color:var(--brass-l);text-decoration:none;font-size:12px;letter-spacing:2px;text-transform:uppercase}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(251,249,245,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:14px 24px calc(14px + env(safe-area-inset-bottom))}
  .bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:14px}
  .pick{flex:1;font-size:12px;color:var(--soft);min-width:0}
  .pick b{display:block;color:var(--ink);font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wa{flex:none;background:#1f7a47;color:#fff;text-decoration:none;font-weight:500;font-size:13.5px;letter-spacing:.3px;padding:13px 20px;border-radius:999px;box-shadow:0 8px 20px -10px rgba(31,122,71,.7)}
  .clear{background:none;border:none;color:var(--soft);font:500 11.5px Inter;text-decoration:underline;cursor:pointer;margin-left:6px}
  footer{text-align:center;color:rgba(236,229,216,.45);font-size:10px;letter-spacing:2.4px;text-transform:uppercase;padding:8px 24px 150px;background:var(--dark);box-shadow:0 0 0 100vmax var(--dark);clip-path:inset(0 -100vmax 0 -100vmax)}
  footer img{width:46px;filter:invert(1);mix-blend-mode:screen;opacity:.55;display:block;margin:0 auto 18px}
</style>
</head>

// Horario (0=lunes … 6=domingo), minutos desde medianoche
const DIAS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const SLOTS=[[[600,840],[960,1200]],[],[[600,840],[960,1200]],[[600,840],[960,1200]],[[600,840],[960,1200]],[[600,840],[960,1200]],[[540,840]]];
const fmt=m=>{let h=Math.floor(m/60),mm=String(m%60).padStart(2,"0"),ap=h>=12?"p. m.":"a. m.";h=h%12||12;return `${h}:${mm} ${ap}`};
function nowMX(){
  const p=new Intl.DateTimeFormat("en-US",{timeZone:"America/Mexico_City",weekday:"short",hour:"numeric",minute:"numeric",hour12:false}).formatToParts(new Date());
  const g=k=>p.find(x=>x.type===k).value;
  return {d:{Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6}[g("weekday")],m:(+g("hour")%24)*60+ +g("minute")};
}
addTab("horario","Horario");
const sh=section("horario","Te esperamos","Horario","","b-sand");
const {d,m}=nowMX();
sh.innerHTML+=`<div class="box">`+DIAS.map((n,i)=>`<div class="hrow${i===d?" today":""}"><span>${n}${i===d?" · hoy":""}</span><span class="${SLOTS[i].length?"":"closed"}">${SLOTS[i].length?SLOTS[i].map(([a,b])=>fmt(a)+" – "+fmt(b)).join("<br>"):"Cerrado"}</span></div>`).join("")+`</div>`;

const open=SLOTS[d].some(([a,b])=>m>=a&&m<b);
let nextTxt="";
if(!open){
  for(let k=0;k<8&&!nextTxt;k++){
    const dd=(d+k)%7;
    for(const [a] of SLOTS[dd]){ if(k>0||a>m){nextTxt=(k===0?"hoy":k===1?"mañana":DIAS[dd].toLowerCase())+" a las "+fmt(a);break;} }
  }
}
const st=document.getElementById("status");
st.querySelector(".dot").style.background=open?"var(--ok)":"var(--off)";
st.lastElementChild.textContent=open?"Abierto ahora":"Cerrado · abre "+nextTxt;

function setTab(id){document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.id===id))}

function updateBar(){
  const pick=document.getElementById("pick"),wa=document.getElementById("wa");
  const list=[...sel];
  let msg="Hola, quiero agendar una cita en B.C. Style Atelier. ¿Qué horario tienen disponible?";
  if(list.length){
    const total=list.reduce((a,b)=>a+b.p,0);
    pick.innerHTML=`${list.length} servicio${list.length>1?"s":""} <button class="clear" id="clr">quitar</button><b>Total: $${total}</b>`;
    document.getElementById("clr").onclick=e=>{e.stopPropagation();sel.clear();document.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));updateBar()};
    msg=`Hola, quiero agendar una cita en B.C. Style Atelier para:\n${list.map(x=>`• ${x.n} ($${x.p})`).join("\n")}\nTotal: $${total}\n¿Qué horario tienen disponible?`;
  }else{
    pick.innerHTML=`Elige tus servicios<b>Agenda tu cita</b>`;
  }
  wa.href=`https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`;
}
updateBar();

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&document.querySelector(`.tab[data-id="${e.target.id}"]`))setTab(e.target.id)}),{rootMargin:"-40% 0px -55% 0px"});
document.querySelectorAll("main section").forEach(s=>io.observe(s));

// Pantalla de inicio: se muestra mínimo 1.6 s y se desvanece al cargar
const T0=Date.now(), splash=document.getElementById("splash");
function hideSplash(){setTimeout(()=>splash.classList.add("hide"),Math.max(0,1600-(Date.now()-T0)))}
if(document.readyState==="complete")hideSplash();else window.addEventListener("load",hideSplash);
</script>
