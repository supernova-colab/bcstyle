<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B.C. Style Atelier · Servicios</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2eee7; --paper:#faf8f4; --ink:#26292b; --soft:#5c5f61; --line:#ddd6ca;
    --dark:#1d1f20; --accent:#8a6d3b; --ok:#3f8f4a; --off:#b4473b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.45;padding-bottom:120px}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px}
  header{text-align:center;padding:18px 18px 22px}
  header img{width:100%;max-width:320px;display:block;margin:0 auto;mix-blend-mode:multiply}
  .status{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
  .dot{width:8px;height:8px;border-radius:50%}
  nav{position:sticky;top:0;z-index:5;background:rgba(242,238,231,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 18px;max-width:560px;margin:0 auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;background:var(--paper);border:1px solid var(--line);color:var(--soft);padding:8px 14px;border-radius:999px;font:500 13px Inter;cursor:pointer}
  .tab.on{background:var(--dark);color:#f2eee7;border-color:var(--dark)}
  h2{font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:700;margin:28px 0 2px;letter-spacing:.5px}
  .h2sub{color:var(--soft);font-size:13px;margin-bottom:14px}
  .menu{background:var(--dark);color:#f2eee7;border-radius:16px;padding:6px 16px}
  .item{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid #34373a;cursor:pointer;user-select:none}
  .item:last-child{border-bottom:none}
  .chk{flex:none;width:22px;height:22px;border:1.5px solid #6b6e70;border-radius:6px;display:grid;place-items:center;font-size:13px;color:transparent;transition:.15s}
  .item.sel .chk{background:#f2eee7;border-color:#f2eee7;color:var(--dark)}
  .iname{font-family:"Cormorant Garamond",serif;font-size:20px;font-weight:600;white-space:nowrap}
  .dots{flex:1;border-bottom:1.5px dotted #6b6e70;transform:translateY(5px);min-width:16px}
  .iprice{font-family:"Cormorant Garamond",serif;font-size:21px;font-weight:700}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;transition:.15s}
  .card.sel{border-color:var(--dark);box-shadow:0 0 0 1.5px var(--dark) inset}
  .card.feat{background:var(--dark);color:#f2eee7;border-color:var(--dark)}
  .card.feat.sel{box-shadow:0 0 0 3px var(--accent) inset}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .name{font-family:"Cormorant Garamond",serif;font-size:23px;font-weight:700}
  .price{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:700;white-space:nowrap}
  .meta{font-size:13px;opacity:.7;margin-top:2px}
  .badge{display:inline-block;font:600 10px Inter;letter-spacing:1px;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:2px 6px;margin-left:8px;vertical-align:middle;opacity:.85}
  ul.inc{list-style:none;margin-top:10px;display:grid;gap:5px}
  ul.inc li{font-size:13.5px;padding-left:18px;position:relative;opacity:.9}
  ul.inc li:before{content:"✦";position:absolute;left:0;font-size:10px;top:3px;color:var(--accent)}
  .hrow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:11px 0;border-bottom:1px solid var(--line)}
  .hrow span:last-child{text-align:right}
  .hrow.today{font-weight:600}
  .closed{color:var(--off)}
  .info{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:6px 16px}
  .info a{color:var(--ink);font-weight:600}
  .info p{font-size:14px;padding:10px 0;border-bottom:1px solid var(--line)}
  .info p:last-child{border-bottom:none}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(250,248,244,.98);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
  .bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .pick{flex:1;font-size:12.5px;color:var(--soft);min-width:0}
  .pick b{display:block;color:var(--ink);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wa{flex:none;background:#25d366;color:#07240e;text-decoration:none;font-weight:600;font-size:14px;padding:12px 16px;border-radius:12px}
  .clear{background:none;border:none;color:var(--soft);font:500 12px Inter;text-decoration:underline;cursor:pointer;margin-left:6px}
  footer{text-align:center;color:var(--soft);font-size:12px;padding:30px 0 10px}
</style>
</head>

  const c=document.createElement("div");c.className="card"+(it.feat?" feat":"");
  c.innerHTML=`<div class="row"><div class="name">${it.n}${it.badge?`<span class="badge">${it.badge}</span>`:""}</div><div class="price">$${it.p}</div></div>
  <div class="meta">⏱ ${it.t}</div><ul class="inc">${it.inc.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  c.onclick=()=>toggle(c,it);sp.appendChild(c);
});

// Horario (0=lunes … 6=domingo), minutos desde medianoche
const DIAS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const SLOTS=[[[600,840],[960,1200]],[],[[600,840],[960,1200]],[[600,840],[960,1200]],[[600,840],[960,1200]],[[600,840],[960,1200]],[[540,840]]];
const fmt=m=>{let h=Math.floor(m/60),mm=String(m%60).padStart(2,"0"),ap=h>=12?"p. m.":"a. m.";h=h%12||12;return `${h}:${mm} ${ap}`};
function nowMX(){
  const p=new Intl.DateTimeFormat("en-US",{timeZone:"America/Mexico_City",weekday:"short",hour:"numeric",minute:"numeric",hour12:false}).formatToParts(new Date());
  const g=k=>p.find(x=>x.type===k).value;
  return {d:{Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6}[g("weekday")],m:(+g("hour")%24)*60+ +g("minute")};
}
addTab("horario","Horario");
const sh=section("horario","Horario","");
const {d,m}=nowMX();
sh.innerHTML+=DIAS.map((n,i)=>`<div class="hrow${i===d?" today":""}"><span>${n}${i===d?" · hoy":""}</span><span class="${SLOTS[i].length?"":"closed"}">${SLOTS[i].length?SLOTS[i].map(([a,b])=>fmt(a)+" – "+fmt(b)).join("<br>"):"Cerrado"}</span></div>`).join("");

const open=SLOTS[d].some(([a,b])=>m>=a&&m<b);
let nextTxt="";
if(!open){
  for(let k=0;k<8&&!nextTxt;k++){
    const dd=(d+k)%7;
    for(const [a] of SLOTS[dd]){ if(k>0||a>m){nextTxt=(k===0?"hoy":k===1?"mañana":DIAS[dd].toLowerCase())+" a las "+fmt(a);break;} }
  }
}
const st=document.getElementById("status");
st.querySelector(".dot").style.background=open?"var(--ok)":"var(--off)";
st.lastElementChild.textContent=open?"Abierto ahora":"Cerrado · abre "+nextTxt;

addTab("visitanos","Ubicación");

<p>📍 Calle Rubén Darío 74, 91615 Teocelo, Ver.<br><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent("Calle Rubén Darío 74, 91615 Teocelo, Veracruz")}" target="_blank" rel="noopener">Abrir en Google Maps</a></p>
<p>💬 WhatsApp: <a href="https://wa.me/${PHONE}" target="_blank" rel="noopener">228 243 4996</a></p>
<p>📸 Instagram: <a href="https://www.instagram.com/b.c_style_atelier_" target="_blank" rel="noopener">@b.c_style_atelier_</a></p></div>`;

function setTab(id){document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.id===id))}
setTab("cortes");

function updateBar(){
  const pick=document.getElementById("pick"),wa=document.getElementById("wa");
  const list=[...sel];
  let msg="Hola, quiero agendar una cita en B.C. Style Atelier. ¿Qué horario tienen disponible?";
  if(list.length){
    const total=list.reduce((a,b)=>a+b.p,0);
    pick.innerHTML=`${list.length} servicio${list.length>1?"s":""} <button class="clear" id="clr">quitar</button><b>Total: $${total}</b>`;
    document.getElementById("clr").onclick=e=>{e.stopPropagation();sel.clear();document.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));updateBar()};
    msg=`Hola, quiero agendar una cita en B.C. Style Atelier para:\n${list.map(x=>`• ${x.n} ($${x.p})`).join("\n")}\nTotal: $${total}\n¿Qué horario tienen disponible?`;
  }else{
    pick.innerHTML=`Elige tus servicios<b>Agenda tu cita</b>`;
  }
  wa.href=`https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`;
}
updateBar();

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setTab(e.target.id)}),{rootMargin:"-40% 0px -55% 0px"});
document.querySelectorAll("main section").forEach(s=>io.observe(s));
</script>
